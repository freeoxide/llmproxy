[package]
name = "llm-proxy-python"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
publish = false
description = "Python bindings for the llm-proxy engine (built with maturin)."

# Standalone workspace: this cdylib builds against the repo crates by path
# but is packaged for PyPI via maturin, not cargo.
[workspace]

[lib]
name = "_llm_proxy"
crate-type = ["cdylib"]

[dependencies]
llm-proxy-bridge = { path = "../../crates/llm-proxy-bridge", version = "0.1.0" }
pyo3 = { version = "0.30", features = ["abi3-py39", "extension-module"] }
serde_json = "1"

[profile.release]
strip = "symbols"
