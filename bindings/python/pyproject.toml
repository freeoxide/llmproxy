[build-system]
requires = ["maturin>=1.16,<2"]
build-backend = "maturin"

[project]
name = "llm-proxy"
version = "0.1.0"
description = "Python bindings for the llm-proxy engine: translation, request execution, streaming and configuration from code."
requires-python = ">=3.9"
license = "MIT OR Apache-2.0"
classifiers = [
  "Programming Language :: Rust",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Software Development :: Libraries",
]

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "llm_proxy._llm_proxy"
python-source = "python"
