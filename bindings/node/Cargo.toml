[package]
name = "llm-proxy-node"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
publish = false
description = "Node bindings for the llm-proxy engine (built with napi-rs)."

# Standalone workspace: this cdylib builds against the repo crates by path
# but is packaged for npm via @napi-rs/cli, not cargo.
[workspace]

[lib]
name = "llm_proxy_node"
crate-type = ["cdylib"]

[dependencies]
llm-proxy-bridge = { path = "../../crates/llm-proxy-bridge", version = "0.1.0" }
napi = { version = "3", default-features = false, features = [
  "napi4",
  "async",
  "tokio_rt",
  "serde-json",
] }
napi-derive = "3"
serde_json = "1"
tokio = { version = "1", features = ["sync"] }

[build-dependencies]
napi-build = "2"

[profile.release]
strip = "symbols"
