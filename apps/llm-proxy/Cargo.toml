[package]
name = "llm-proxy"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Multi-command CLI and daemon for the provider-scoped LLM proxy server."
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
name = "llm_proxy_app"
path = "src/lib.rs"

[[bin]]
name = "llm-proxy"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
llm-proxy-server = { workspace = true }
llm-proxy-core = { workspace = true }
llm-proxy-provider = { path = "../../crates/llm-proxy-provider" }
llm-proxy-storage = { path = "../../crates/llm-proxy-storage" }

anyhow = { workspace = true }
axum = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
time = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
socket2 = "0.6"

[build-dependencies]
vergen-gix = { workspace = true }

[dev-dependencies]
insta = { version = "1.42", features = ["yaml", "filters"] }
llm-proxy-protocol = { path = "../../crates/llm-proxy-protocol" }
tempfile = "3"
toml = { workspace = true }
