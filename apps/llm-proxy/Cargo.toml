[package]
name = "llm-proxy-app"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Multi-command CLI and daemon for the provider-scoped LLM proxy server."
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
name = "llm_proxy_app"
path = "src/lib.rs"

[[bin]]
name = "llm-proxy"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
llm-proxy-server = { workspace = true, features = ["admin"] }

# OTel OTLP metric export (plan 07 step 7, backlog 21). The blocking reqwest
# client carries its own reactor thread, which is what the SDK's thread-based
# PeriodicReader needs.
opentelemetry = { version = "0.33", default-features = false, features = ["metrics"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["metrics"] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["http-json", "reqwest-blocking-client", "metrics"] }
secrecy = { workspace = true }
llm-proxy-core = { workspace = true }
llm-proxy-adapters = { workspace = true }
llm-proxy-transport = { workspace = true }
llm-proxy-engine = { workspace = true }
llm-proxy-storage = { workspace = true, features = ["sqlite"] }

anyhow = { workspace = true }
thiserror = { workspace = true }
axum = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
time = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }
serde_json = { workspace = true }
rust_decimal = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
socket2 = "0.6"

[build-dependencies]
vergen-gix = { workspace = true }

[dev-dependencies]
insta = { version = "1.42", features = ["yaml", "filters"] }
axum = { workspace = true }
llm-proxy-protocol = { workspace = true }
tempfile = "3"
