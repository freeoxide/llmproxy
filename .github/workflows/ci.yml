name: CI
on: [push, pull_request]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.1
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Lint inheritance
        run: |
          for f in $(find . -name Cargo.toml -not -path './target/*' -not -path './ref/*' -not -path './Cargo.toml'); do
            grep -q 'workspace = true' "$f" || { echo "Missing [lints] workspace = true in $f"; exit 1; }
          done

      - name: Test
        run: cargo test --workspace --all-features

      - name: Locked build
        run: cargo build --locked

  # Replaces the rustc `unused_crate_dependencies` lint, which cannot
  # distinguish a genuinely unused dependency from one that a sibling
  # compilation target of the same crate uses. cargo-shear analyses the
  # whole workspace and does not have that false-positive mode.
  unused-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.1
      - uses: Swatinem/rust-cache@v2
      # Pinned: cargo-shear >= 1.14 pulls ra_ap_* crates that require
      # rustc 1.98, above the 1.96.1 toolchain pinned above. Bump both together.
      - run: cargo install cargo-shear --locked --version 1.13.0
      - run: cargo shear
