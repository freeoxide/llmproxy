[package]
name = "llm-proxy-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Core configuration, routing, registry, and metrics types shared across the llm-proxy crates."
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["tiktoken"]
# Real BPE token counting for known OpenAI model ids. Without it the counter
# falls back to the ~4-chars/token heuristic everywhere.
tiktoken = ["dep:tiktoken-rs"]

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
humantime-serde = { workspace = true }
regex = { workspace = true }
tracing = { workspace = true }
secrecy = { workspace = true }
tiktoken-rs = { workspace = true, optional = true }
rust_decimal = { workspace = true }

[dev-dependencies]
tempfile = "3"
