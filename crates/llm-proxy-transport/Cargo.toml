[package]
name = "llm-proxy-transport"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "HTTP egress for llm-proxy: the pooled upstream client, redirect/timeout policy, egress proxies, and model discovery."
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
llm-proxy-core = { workspace = true }
llm-proxy-adapters = { workspace = true }

bytes = "1"
form_urlencoded = "1"
# One TLS stack only (audit BUG-23): default-features = false drops
# default-tls (native-tls/OpenSSL); rustls is the single stack, including for
# musl builds. "socks" enables socks5/socks5h forward-proxy support for
# [provider.egress]; http2 and charset are re-added explicitly because they
# were part of the defaults.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
    "rustls-tls",
    "socks",
    "charset",
    "http2",
] }
futures = "0.3"
tokio = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
secrecy = { workspace = true }

[dev-dependencies]
axum = { workspace = true, features = ["macros", "json"] }
# io-util: read_exact/write_all for the in-test SOCKS5 handshake server.
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "io-util"] }
