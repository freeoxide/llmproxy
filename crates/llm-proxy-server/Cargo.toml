[package]
name = "llm-proxy-server"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Axum router wiring for llm-proxy: routes, middleware, and shared server state."
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
llm-proxy-core = { workspace = true }
llm-proxy-protocol = { path = "../llm-proxy-protocol" }
llm-proxy-provider = { path = "../llm-proxy-provider" }
llm-proxy-storage = { path = "../llm-proxy-storage" }
llm-proxy-api = { path = "../llm-proxy-api" }

axum = { workspace = true, features = ["macros", "json"] }
tokio = { workspace = true, features = ["fs"] }
tokio-stream = "0.1"
tokio-util = { workspace = true }
tower = { workspace = true }
tower-http = { version = "0.6", features = ["trace", "timeout", "catch-panic", "set-header", "cors"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
bytes = "1"
futures = "0.3"
regex = { workspace = true }
sha2 = "0.10"
argon2 = { workspace = true }
toml = { workspace = true }
time = { workspace = true }
secrecy = { workspace = true }
rust_decimal = { workspace = true }

[dev-dependencies]
tower = { workspace = true, features = ["util"] }
llm-proxy-storage = { path = "../llm-proxy-storage", features = ["test-utils"] }
tempfile = "3"
tracing-subscriber = { workspace = true }
