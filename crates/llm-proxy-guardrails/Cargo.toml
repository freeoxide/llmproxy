[package]
name = "llm-proxy-guardrails"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The optional guardrail set for llm-proxy (plan 09 step 4, audit conflict 9): every guard declares its mode (pre-call, buffered, post-hoc) and fail policy, and a guard that cannot mask across stream chunks rejects streams instead."
repository.workspace = true
readme.workspace = true
keywords = ["llm", "proxy", "guardrails", "redaction"]
categories = ["web-programming::http-server"]

[lints]
workspace = true

[dependencies]
llm-proxy-engine = { workspace = true }
llm-proxy-protocol = { workspace = true }

async-trait = { workspace = true }
regex = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
llm-proxy-adapters = { workspace = true }
llm-proxy-core = { workspace = true }
llm-proxy-storage = { workspace = true }
axum = { workspace = true, features = ["macros", "json"] }
secrecy = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
