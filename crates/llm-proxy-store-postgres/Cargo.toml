[package]
name = "llm-proxy-store-postgres"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Replica-shared admission, cooldowns and usage for llm-proxy, held in Postgres (plan 09, audit conflict 13)."
repository.workspace = true
readme.workspace = true
keywords = ["llm", "proxy", "postgres", "rate-limiting", "budgets"]
categories = ["web-programming::http-server"]

[lints]
workspace = true

[dependencies]
llm-proxy-core = { workspace = true }
llm-proxy-engine = { workspace = true }
llm-proxy-storage = { workspace = true, default-features = false }

async-trait = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }
deadpool-postgres = { version = "0.14", features = ["rt_tokio_1"] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1", "with-uuid-1", "with-time-0_3"] }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
llm-proxy-protocol = { workspace = true }
