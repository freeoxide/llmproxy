[package]
name = "llm-proxy-provider"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Upstream provider adapter framework with streaming, model discovery, and per-provider encoding."
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
llm-proxy-core = { workspace = true }
llm-proxy-protocol = { path = "../llm-proxy-protocol" }
bytes = "1"
form_urlencoded = "1"
# "socks" enables socks5/socks5h forward-proxy support for [provider.egress]
# (verified against docs.rs/reqwest 0.12 and empirically in transport.rs tests).
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls", "socks"] }
futures = "0.3"
tokio = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
regex = { workspace = true }
uuid = { workspace = true }
secrecy = { workspace = true }

[dev-dependencies]
axum = { workspace = true, features = ["macros", "json"] }
# io-util: read_exact/write_all for the in-test SOCKS5 handshake server.
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "io-util"] }
