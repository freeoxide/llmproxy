[package]
name = "llm-proxy-bridge"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The language-neutral surface the Python and Node bindings wrap: translation, request execution, streaming events and configuration as plain JSON."
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
llm-proxy-core = { workspace = true }
llm-proxy-protocol = { workspace = true }
llm-proxy-adapters = { workspace = true }
llm-proxy-transport = { workspace = true }
llm-proxy-engine = { workspace = true }
llm-proxy-storage = { workspace = true, default-features = false }
futures = "0.3"
secrecy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }

[dev-dependencies]
axum = { workspace = true }
futures = "0.3"
tokio = { workspace = true }
