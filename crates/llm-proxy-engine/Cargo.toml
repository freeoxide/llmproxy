[package]
name = "llm-proxy-engine"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The llm-proxy request engine: the full pipeline (admission, routing, credentials, guards, cache, egress, settlement) with no HTTP layer."
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
llm-proxy-core = { workspace = true }
llm-proxy-protocol = { workspace = true }
llm-proxy-adapters = { workspace = true }
llm-proxy-transport = { workspace = true }
llm-proxy-storage = { workspace = true }

async-trait = { workspace = true }
bytes = "1"
futures = "0.3"
regex = { workspace = true }
rust_decimal = { workspace = true }
time = { workspace = true }
toml = { workspace = true }
secrecy = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time", "fs"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
axum = { workspace = true, features = ["macros", "json"] }
llm-proxy-storage = { workspace = true, features = ["test-utils", "sqlite"] }
sha2 = "0.10"
